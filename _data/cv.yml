- title: Selected Projects
  type: time_table
  contents:
  - title: '<a href="https://doi.org/10.1145/3742413.3789061">SCSimulator: An Exploratory
      Visual Analytics Framework for Partner Selection in Supply Chains through LLM-driven
      Multi-Agent Simulation</a>'
    year: 2025.01 - 2026.02
    maindescription: First author; IUI 2026.
    description:
    - Proposed a framework integrating LLM-driven multi-agent simulation with human-in-the-loop
      collaboration for supply-chain partner selection.
    - Designed a visual analytics system supporting dynamic network exploration, agent-level
      intervention, and simulation path branching.
    - Integrated predictive modeling, SHAP-based explainable AI, and chain-of-thought
      reasoning to explain agent decisions and network impacts.
    - Evaluated the system through quantitative simulation evaluation, a usage scenario,
      and expert user studies.
  - title: '<a href="https://doi.org/10.1145/3772318.3790530">CommSense: Facilitating
      Bias-Aware and Reflective Navigation of Online Comments for Rational Judgment</a>'
    year: 2025.06 - 2026.01
    maindescription: Co-first author; CHI 2026.
    description:
    - 'Investigated a four-stage judgment process: initial framing, evidence foraging,
      belief updating, and synthesis and judgment.'
    - Led a co-design workshop to derive four design requirements for bias mitigation.
    - Designed and implemented overview visualization, structured annotation, reflective
      prompts, and synthesis scaffolding.
    - Conducted user studies demonstrating improved bias awareness, reflective reasoning,
      and evidence-based judgment while maintaining high usability.
  - title: '<a href="https://doi.org/10.1109/TVCG.2025.3538768">From Requirement to
      Solution: Unveiling Problem-Driven Design Patterns in Visual Analytics</a>'
    year: 2023.12 - 2024.04
    maindescription: TVCG 2025.
    description:
    - Developed a methodology for meta-analysis of visual analytics research from
      a problem-driven perspective.
    - Contributed a solution typology and refined requirement and data typologies
      to update visual analytics abstraction frameworks.
    - Represented problem-solving practices through a dense, directed, weighted graph.
